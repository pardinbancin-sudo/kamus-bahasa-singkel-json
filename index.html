<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Bahasa Singkel Berwarna</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #4f46e5, #06b6d4); 
            color: #1e293b; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
        }
        header { 
            background: rgba(15, 23, 42, 0.85); 
            color: white; 
            padding: 35px 20px; 
            text-align: center; 
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #38bdf8;
        }
        header h1 { margin: 0 0 5px 0; font-size: 26px; }
        header p { margin: 0; color: #cbd5e1; font-size: 14px; }

        .container { max-width: 750px; margin: 30px auto; padding: 0 20px; }
        
        /* Kotak Terjemahan Berwarna & Presisi */
        .translator-box { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            margin-bottom: 25px; 
        }
        .translator-grid { 
            display: flex; 
            gap: 20px; 
            align-items: center; 
        }
        .translator-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }
        .translator-pane:focus-within {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }
        .translator-pane label { 
            font-size: 13px; 
            font-weight: bold; 
            color: #4f46e5; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .translator-pane textarea { 
            width: 100%; 
            height: 100px; 
            padding: 10px; 
            border: none; 
            background: transparent;
            font-size: 16px; 
            outline: none; 
            resize: none; 
            box-sizing: border-box; 
            color: #1e293b;
        }
        .arrow-icon { 
            font-size: 24px; 
            color: #4f46e5; 
            font-weight: bold; 
            text-align: center; 
            background: #e0e7ff;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Tombol Aksi */
        .action-btns { display: flex; gap: 8px; margin-top: 10px; border-top: 1px dashed #cbd5e1; padding-top: 10px; }
        .btn-action { background: #4f46e5; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; transition: background 0.2s; }
        .btn-action:hover { background: #4338ca; }

        .stats { margin: 15px 0; font-size: 13px; color: #f1f5f9; text-align: right; font-weight: 600; }
        
        .word-card { 
            background: white; 
            border-radius: 12px; 
            padding: 18px 20px; 
            margin-bottom: 12px; 
            border-left: 5px solid #06b6d4; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            transition: transform 0.2s;
        }
        .word-card:hover { transform: translateY(-2px); }
        .word-indo { font-size: 18px; font-weight: bold; color: #1e293b; }
        .word-daerah { font-size: 18px; font-weight: bold; color: #4f46e5; }
        .detail { margin-top: 8px; font-size: 14px; color: #64748b; border-top: 1px dashed #e2e8f0; padding-top: 8px; }
        .not-found { text-align: center; padding: 30px; background: white; border-radius: 12px; color: #64748b; font-weight: 500; }

        @media (max-width: 650px) {
            .translator-grid { flex-direction: column; }
            .arrow-icon { transform: rotate(90deg); margin: 5px auto; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Kamus Bahasa Singkel</h1>
        <p>Penerjemah Interaktif, Pelafalan Suara, & Salin Teks</p>
    </header>

    <div class="container">
        <!-- Kotak Terjemahan Presisi & Berwarna -->
        <div class="translator-box">
            <div class="translator-grid">
                <div class="translator-pane">
                    <label>Bahasa Indonesia</label>
                    <textarea id="inputIndo" placeholder="Ketik kata Indonesia..." onkeyup="terjemahkanKeSingkel()"></textarea>
                </div>
                <div class="arrow-icon">⇄</div>
                <div class="translator-pane" style="background: #f0fdf4; border-color: #bbf7d0;">
                    <label style="color: #16a34a;">Bahasa Singkel</label>
                    <textarea id="outputSingkil" placeholder="Hasil terjemahan Singkil..." readonly style="background-color: transparent;"></textarea>
                    <div class="action-btns">
                        <button class="btn-action" style="background: #16a34a;" onclick="salinTeks()">📋 Salin</button>
                        <button class="btn-action" style="background: #16a34a;" onclick="suaraPelafalan()">🔊 Dengar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats" id="stats">Memuat jumlah kosakata kamus...</div>
        <div id="hasil"><div class="not-found">Ketik kata di atas untuk melihat daftar kamus terkait.</div></div>
    </div>

    <script>
        var kamusData = [];
        var urlJSON = "https://raw.githubusercontent.com/pardinbancin-sudo/kamus-bahasa-singkel-json/refs/heads/main/kosakata.json";

        fetch(urlJSON)
            .then(function(response) { return response.json(); })
            .then(function(data) {
                kamusData = data;
                document.getElementById('stats').innerHTML = "Kamus siap digunakan (" + kamusData.length + " kosakata)";
            })
            .catch(function(error) {
                document.getElementById('stats').innerHTML = "Gagal memuat data kamus.";
            });

        function terjemahkanKeSingkel() {
            var keyword = document.getElementById('inputIndo').value.toLowerCase().trim();
            var outputBox = document.getElementById('outputSingkil');
            var container = document.getElementById('hasil');

            if (keyword === "") {
                outputBox.value = "";
                container.innerHTML = '<div class="not-found">Ketik kata di atas untuk melihat daftar kamus terkait.</div>';
                return;
            }

            var hasilPencarian = [];
            var terjemahanDitemukan = "";

            for (var i = 0; i < kamusData.length; i++) {
                var item = kamusData[i];
                if (item.indonesia.toLowerCase().indexOf(keyword) !== -1 || item.bahasa_daerah.toLowerCase().indexOf(keyword) !== -1) {
                    hasilPencarian.push(item);
                    if (item.indonesia.toLowerCase() === keyword) {
                        terjemahanDitemukan = item.bahasa_daerah;
                    }
                }
            }

            if (terjemahanDitemukan !== "") {
                outputBox.value = terjemahanDitemukan;
            } else if (hasilPencarian.length > 0) {
                outputBox.value = hasilPencarian[0].bahasa_daerah + " (Mendekati)";
            } else {
                outputBox.value = "Kata tidak ditemukan";
            }

            tampilkanHasilCard(hasilPencarian);
        }

        function tampilkanHasilCard(data) {
            var container = document.getElementById('hasil');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="not-found">Kosakata tidak ditemukan dalam kamus.</div>';
                return;
            }
            
            var html = "";
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                html += '<div class="word-card">';
                html += '<span class="word-indo">' + item.indonesia + '</span> ➔ <span class="word-daerah">' + item.bahasa_daerah + '</span>';
                html += '<div class="detail"><b>Kategori:</b> ' + (item.kategori || 'Umum') + '<br><b>Contoh:</b> ' + item.contoh_indonesia + ' (' + item.contoh_daerah + ')</div>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function salinTeks() {
            var outputBox = document.getElementById('outputSingkil');
            if (outputBox.value === "" || outputBox.value === "Kata tidak ditemukan") {
                alert("Tidak ada teks untuk disalin!");
                return;
            }
            navigator.clipboard.writeText(outputBox.value);
            alert("Teks berhasil disalin: " + outputBox.value);
        }

        function suaraPelafalan() {
            var teks = document.getElementById('outputSingkil').value;
            if (teks === "" || teks === "Kata tidak ditemukan") {
                alert("Tidak ada kata untuk dilafalkan!");
                return;
            }
            var speech = new SpeechSynthesisUtterance(teks);
            speech.lang = 'id-ID';
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
